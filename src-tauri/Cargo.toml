[package]
name = "redfish-schema-browser-rs"
version = "0.2.0"
authors = ["9506hqwy"]
# https://github.com/tauri-apps/tauri/issues/10412
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/9506hqwy/redfish-schema-browser-rs"
license = "MIT OR Apache-2.0"
keywords = ["redfish"]
categories = ["development-tools"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
once_cell = "1.21.4"
regex = "1.13.1"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.4", features = [] }
tauri-plugin-cli = "2.5.0"
tauri-plugin-dialog = "2.8.3"
url = "2.5.8"

[profile.release]
strip = "symbols"
lto = true
