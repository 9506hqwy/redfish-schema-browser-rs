name: CI

on:
  push:
    branches: [ main ]
    tags-ignore: [ '**' ]
    paths-ignore:
      - '.devcontainer/**'
      - '.github/**'
      - '.vscode/**'
      - '.gitignore'
      - '.lefthook.yml'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'README.md'
      - 'taskfile.yml'
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    uses: 9506hqwy/actions/.github/workflows/tauri-ci-ubuntu.yml@main

  windows:
    uses: 9506hqwy/actions/.github/workflows/tauri-ci-windows.yml@main
